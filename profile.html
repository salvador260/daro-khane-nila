<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7f6;
        }

        .profile-box {
            width: 90%;
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #168c5b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-box h1 {
            margin-bottom: 25px;
        }

        .profile-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: right;
        }

        .back-button {
            display: block;
            margin-top: 25px;
            padding: 13px;
            background: #168c5b;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="profile-box">

        <div class="profile-icon">👤</div>

        <h1>پنل کاربری</h1>

        <div class="profile-info">
            <strong>نام:</strong>
            کاربر سایت
        </div>

        <div class="profile-info">
            <strong>شماره موبایل:</strong>
            09xxxxxxxxx
        </div>

      <button type="button" onclick="if (history.length > 1) { history.back(); } else { window.location.href='index.html'; }">
    بازگشت به سایت
</button>
    </div>

</body>
</html>
